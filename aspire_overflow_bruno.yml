          name: Login as bob
          type: http
          seq: 1
        http:
          method: POST
          url: '{{identityApi}}/realms/overflow/protocol/openid-connect/token'
          body:
            type: form-urlencoded
            data:
              - name: username
                value: bob
              - name: password
                value: Pa$$w0rd
              - name: client_id
                value: bruno
              - name: grant_type
                value: password
              - name: client_secret
                value: zWJYJbQJ2ygrDvDxFSdhs8MSroFlGZcs
                disabled: true
          auth: inherit
        runtime:
          scripts:
            - type: after-response
              code: |-
                const user = res.getBody();

                test("Has properties", function () {
                    expect(user).to.have.property('access_token');
                });

                if (test("Has properties")) {
                    bru.setEnvVar('bob_token', user.access_token);
                }
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
      - info:
          name: Post question with malicious script
          type: http
          seq: 2
        http:
          method: POST
          url: '{{gateway}}/questions'
          body:
            type: json
            data: |-
              {
                  "title": "{{$randomPhrase}}",
                  "content": "<p>This is a test</p><img src=x onerror=\"alert('You have been hacked. Gimme all your cash!!!')\">",
                  "tags": {{selectedTags}}
              }
          auth:
            type: bearer
            token: '{{bob_token}}'
        runtime:
          scripts:
            - type: before-request
              code: "const raw = bru.interpolate(\"{{$randomLoremParagraphs}}\");\r\n\r\n// Split on newlines, wrap each line in <p> tags, then join\r\nconst html = raw\r\n  .split('\\n')\r\n  .filter(p => p.trim().length > 0)\r\n  .map(p => `<p>${p}</p>`)\r\n  .join('');\r\n\r\nbru.setEnvVar(\"escapedContent\", JSON.stringify(html).slice(1, -1));\r\n\r\nconst allTags = [\"aspire\", \"dotnet\", \"keycloak\", \"wolverine\", \"ef-core\", \"postgresql\", \"signalr\", \"microservices\", \"nextjs\", \"typescript\"];\r\n\r\n// Pick 1 or 2 tags at random\r\nconst shuffled = allTags.sort(() => 0.5 - Math.random());\r\nconst selectedTags = shuffled.slice(0, Math.floor(Math.random() * 2) + 1);\r\n\r\n// Set as environment variable for use in body\r\nbru.setEnvVar('selectedTags', JSON.stringify(selectedTags));"
            - type: after-response
              code: |-
                const question = res.getBody();

                test("Has properties", function () {
                    expect(question).to.have.property('id');
                });

                if (test("Has properties")) {
