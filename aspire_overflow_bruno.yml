          type: http
          seq: 3
        http:
          method: DELETE
          url: '{{gateway}}/questions/{{questionId}}'
          auth:
            type: bearer
            token: '{{bob_token}}'
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
